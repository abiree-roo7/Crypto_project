<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SOC - Analyseur TLS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .table { color: #e2e8f0; }
        .badge-critical { background-color: #ef4444; }
        .badge-warning { background-color: #f59e0b; }
        .badge-info { background-color: #3b82f6; }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom border-secondary">
            <h1> Centre de Contrôle TLS (SOC)</h1>
            <span class="badge bg-success p-2">● Serveur Live</span>
        </div>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card p-4 h-100">
                    <h3 class="h5 mb-4 text-center text-white">Répartition des Risques</h3>
                    <div style="max-width: 300px; margin: 0 auto;">
                        <canvas id="monGraphique"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="h5 m-0">Alertes Temps Réel</h3>
                        <a href="/api/alertes" target="_blank" class="btn btn-sm btn-outline-info">Voir l'API brute JSON</a>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Sévérité</th>
                                    <th>Source</th>
                                    <th>Message</th>
                                </tr>
                            </thead>
                            <tbody id="tableau-alertes">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Récupérer les données JSON de notre API Flask
        fetch('/api/alertes')
            .then(response => response.json())
            .then(data => {
                
                // --- PARTIE A : REMPLIR LE TABLEAU HTML ---
                const tbody = document.getElementById('tableau-alertes');
                let nbCritical = 0, nbWarning = 0, nbInfo = 0;

                data.forEach(alerte => {
                    // On compte pour le graphique
                    if(alerte.severite === 'critical') nbCritical++;
                    if(alerte.severite === 'warning') nbWarning++;
                    if(alerte.severite === 'info') nbInfo++;

                    // On crée une ligne de tableau avec un badge de couleur
                    let badgeClass = 'badge-' + alerte.severite;
                    let row = `
                        <tr>
                            <td><strong>#${alerte.id}</strong></td>
                            <td><span class="badge ${badgeClass}">${alerte.severite.toUpperCase()}</span></td>
                            <td><code>${alerte.ip_source}</code></td>
                            <td>${alerte.message}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

                // --- PARTIE B : CRÉER LE GRAPHIQUE CHART.JS ---
                const ctx = document.getElementById('monGraphique').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut', // Type de graphique en anneau
                    data: {
                        labels: ['Critical', 'Warning', 'Info'],
                        datasets: [{
                            data: [nbCritical, nbWarning, nbInfo],
                            backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        plugins: {
                            legend: { labels: { color: '#e2e8f0' } }
                        }
                    }
                });

            })
            .catch(error => console.error("Erreur lors du chargement des données API :", error));
    </script>
</body>
</html>
